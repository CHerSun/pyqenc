extraction:
  include: null   # regex — keep only matching streams; null = all
  exclude: null   # regex — drop matching streams; overrides include

chunking:
  mode: lossless            # "lossless" (FFV1, frame-perfect) | "remux" (stream-copy, I-frame aligned)
  scene_threshold: 0.3      # 0.0–1.0, lower = more sensitive
  min_scene_length: 24      # minimum frames per chunk

encoding:
  targets:
    - "vif-med:92.0"        # film grain retention; 92–94 is good
    - "vif-min:88.0"        # min safeguard
    - "vmaf-p05:95.0"       # p05 is more stable than median on short chunks
    - "vmaf-min:92.0"       # min safeguard
    - "psnr-med:45.0"       # 44–46 gives good quality retention
    - "psnr-min:42.0"       # min safeguard
    - "ssim-med:98.0"       # SSIM is highly non-linear; 98+ is visually good
    - "ssim-min:95.0"       # min safeguard
  strategies:
    - "h264*"               # all h264 profiles with their default preset (veryslow)
    - "h265*"               # all h265 profiles with their default preset (slow)
    # Pattern syntax: "profile[+preset]" where profile is required, preset is optional
    # Examples:
    #   "h265-aq"           → h265-aq profile with default preset
    #   "h265*"             → all h265* profiles with each codec's default preset
    #   "h265-aq+slow"      → h265-aq profile with slow preset
    #   "h265*+slow"        → all h265* profiles with slow preset
    #   "h265*+*"           → all h265* profiles with all their presets
    #   "*"                 → all profiles with their default presets
    #   "*+*"               → all profiles with all presets
    # - "av1*"              # AV1: limited HW decoding support on older devices
    # - "nvenc-h265-10bit-cq"  # NVENC: requires NVIDIA GPU
    # - "vulkan*"           # Vulkan: requires GPU + Vulkan SDK
  optimize: true            # false = encode all strategies, skip selection
  optimize_tolerance: 5.0   # % size margin — strategies within this % of best are equivalent
  concurrency: 1            # max simultaneous ffmpeg encoding processes
  visual_hash: true         # emoji prefix on chunk log lines

measurement:
  sampling: 1               # measure every N-th frame (1 = every frame; 3 = faster, slightly less precise)
                            # applies to encoding quality checks, merge verification, and standalone measure command

audio:
  convert_pattern: "^(norm|dynaudnorm|2\\.0 (std|night|nboost)) ←"  # selects processed files for delivery conversion
  codec: aac                # ffmpeg audio codec
  bitrate_per_channel: 96k  # per-channel; runtime scaling: ×2=2.0→192k, ×6=5.1→576k, ×8=7.1→768k
  extension: .m4a           # output file extension
  peak_target_dbfs: -1.0    # target peak level in dBFS for all normalisation passes

# CODEC DEFINITIONS
# Each codec entry specifies the encoder, pixel format, quality control parameters, encoder_args template, and supported presets.
# encoder_args placeholders: {input} (source path), {quality} (quality value), {preset}, {profile_args} (profile extra_args), {vf} (filtergraph).
codecs:
  h264-8bit:                  # H.264 codec via libx264 and CRF quality control
    default_quality: 18.0
    default_preset: veryslow   # h.264 is lighter than h.265; veryslow is affordable and gives good benefit
    quality_range: [6.0, 30.0] # CRF 0..51 for this codec. 10-30 looks to be a good working band. 6 is a bit extreme already, but keeping that to give space to quality search algo.
    quality_granularity: 0.5   # libx264 accepts CRF with granularity of 0.1, but that's too low for quality search and could produce binary-identical outputs,
    encoder_args:              # which cause problems with the quality search. 0.5 is a good granularity here.
      - "-i"
      - "{input}"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "{preset}"
      - "-x264-params"
      - "profile=high:level=5.1:sps-id=0" # Attempt to fix problems with varying codec_private_data between chunks. High + 5.1 should be enough and widely compatible. This is specific to h.264.
      - "-crf"
      - "{quality}"
      - "-vf"
      - "{vf}"
      - "-pix_fmt"
      - "yuv420p"
      - "{profile_args}"
    presets:
      - ultrafast              # fastest
      - superfast
      - veryfast
      - faster
      - fast
      - medium
      - slow
      - slower
      - veryslow               # h.264 is an older, lighter codec. With modern CPUs veryslow is quite affordable, still cheaper then h.265 often.
      - placebo                # best quality, very slow

  h265-10bit:                  # H.265 codec via libx265 and CRF quality control
    default_quality: 18.0
    default_preset: slow       # h.265 is CPU intensive; slow is the optimal speed vs quality balance
    quality_range: [6.0, 30.0] # CRF 0..51 for this codec. 10-30 looks to be a good working band. 6 - for extra algo space.
    quality_granularity: 0.5   # same as for libx264. 0.5 is a good granularity here.
    encoder_args:
      - "-i"
      - "{input}"
      - "-c:v"
      - "libx265"
      - "-preset"
      - "{preset}"
      - "-crf"
      - "{quality}"
      - "-vf"
      - "{vf}"
      - "-pix_fmt"
      - "yuv420p10le"
      - "{profile_args}"
    presets:
      - ultrafast             # fastest
      - superfast
      - veryfast
      - faster
      - fast
      - medium
      - slow                  # h.265 is quite CPU intensive. Slow looks like the optimal choice for speed vs quality.
      - slower
      - veryslow
      - placebo               # extremely slow

  nvenc-h265-10bit-cq:         # HEVC NVENC GPU encoding with CQ quality control.
    default_quality: 18.0      # CQ = Constant Quality - a perception-based quality, controlled by the codec. Nvidia answer to CRF.
    default_preset: p7         # p7 is the highest quality NVENC preset; speed difference between presets is negligible on modern GPUs
    quality_range: [6.0, 30.0] # CQ codec range is 0-51. 6-30 is quite wide for nvenc CQ.
    quality_granularity: 0.5   # 0.5 looks to be a good granularity here.
    quality_label: "CQ"
    encoder_args:
      - "-i"
      - "{input}"
      - "-vf"
      - "{vf},format=p010le,hwupload_cuda"
      - "-c:v"
      - "hevc_nvenc"
      - "-preset"
      - "{preset}"
      - "-tune:v"
      - "hq"
      - "-rc:v"
      - "vbr"
      - "-b:v"
      - "0"
      - "-cq:v"
      - "{quality}"
      - "-qmin"                # without qmin/qmax CQ often ignores requested quality and produces much worse results. Currently we cannot dynamically control those extra params
      - "{quality}"            # so we use the same quality here too. This is not ideal, but it is better than nothing. In the future we could add support for extra params in the profile's extra_args list.
      - "-qmax"                # TODO: make a percentage of quality, like 50%, 120% for the qmin/qmax
      - "{quality}"
      - "{profile_args}"
    presets:
      - p1
      - p2
      - p3
      - p4
      - p5
      - p6
      - p7                     # slowest, best quality. Normally, difference in speed is negligible between codecs for single encoder on modern GPUs.

  nvenc-h265-10bit-qp:         # NOT RECOMMENDED! Use CQ instead. QP = Quantization Parameter - it directly controls how many bits to use, straightforward and dumb.
    default_quality: 18.0      # Often wastes bandwidth and gives subpar results. Only use if you have specific reason to do so and know what you are doing.
    default_preset: p7         # p7 is the highest quality NVENC preset
    quality_range: [6.0, 30.0] # 0-51 codec range.
    quality_granularity: 1.0   # <int>!
    quality_label: "QP"
    encoder_args:
      - "-i"
      - "{input}"
      - "-vf"
      - "{vf},format=p010le,hwupload_cuda"
      - "-c:v"
      - "hevc_nvenc"
      - "-preset"
      - "{preset}"
      - "-tune:v"
      - "hq"
      - "-rc:v"
      - "constqp"
      - "-qp:v"
      - "{quality}"
      - "{profile_args}"
    presets:
      - p1
      - p2
      - p3
      - p4
      - p5
      - p6
      - p7                     # slowest, best quality. Normally, difference in speed is negligible between codecs for single encoder on modern GPUs.

  nvenc-h265-10bit-vbr:            # NOT RECOMMENDED. NVenc multipass VBR in single ffmpeg run. VBR = Variable Bitrate. It is similar to CQ, but tries to give more preference
    default_quality: 20.0          # to static scenes. This ruins measured results, which causes the search to increase quality above the level it should be at and waste bits.
    default_preset: p7             # p7 is the highest quality NVENC preset
    quality_range: [99.5, 0.5]     # Limit to 99.5Mbit/s, reversed (higher=better). The upper limit is purely for display formatting. Can set anything really, but 99 should be more then enough.
    quality_granularity: 0.5       # Too low granularity wastes steps on identical attempts, too high causes overshooting. 0.5Mbit/s seems to be a good balance for VBR.
    quality_max_step: 10.0
    quality_label: "Mbit/s"
    encoder_args:
      - "-i"
      - "{input}"
      - "-vf"
      - "{vf},format=p010le,hwupload_cuda"
      - "-c:v"
      - "hevc_nvenc"
      - "-preset"
      - "{preset}"
      - "-tune:v"
      - "hq"
      - "-rc:v"
      - "vbr"
      - "-multipass"    # nvenc-specific multipass implementation within single ffmpeg run
      - "fullres"
      - "-b:v"
      - "{quality}M"    # NOTE the `M` - for Mbit/s.
      # - "-maxrate"    # can't control this dynamically yet
      # - "12M"
      # - "-bufsize"    # can't control this dynamically yet
      # - "16M"
      - "{profile_args}"
    presets:
      - p1
      - p2
      - p3
      - p4
      - p5
      - p6
      - p7         # slowest, best quality. Normally, difference in speed is negligible between codecs for single encoder on modern GPUs.

  # TODO: better vulkan codec profile
  # Vulkan is currently not very mature. It supports only CBR, VBR and QP. CBR and single-pass VBR are not really suitable for controllable video encoding. Sticking with QP for now.
  vulkan-h265-10bit-qp:     # STRONGLY NOT RECOMMENDED! QP = Quantization Parameter - it directly controls how many bits to use, straightforward and dumb. Often wastes bandwidth.
    default_quality: 20     # Use Vulkan only if you have no other GPU API supported. It is not mature enough yet. Results are often subpar, even comparing to other GPU profiles.
    default_preset: any     # hevc_vulkan has no meaningful presets — only "any" is available
    quality_range: [6, 34]  # [-1, 255] actually. -1=auto. Values above 50 produce ugly quality.
    quality_granularity: 1  # <int>!
    quality_label: "QP"
    encoder_args:
      - "-hwaccel"
      - "vulkan"
      - "-init_hw_device"
      - "vulkan=vkdev:0"
      - "-filter_hw_device"
      - "vkdev"
      - "-i"
      - "{input}"
      - "-vf"
      - "format=p010le,{vf},hwupload=derive_device=vulkan"
      - "-c:v"
      - "hevc_vulkan"
      - "-rc_mode"
      - "cqp"
      - "-tune"
      - "hq"
      - "-profile:v"
      - "main10"
      - "-usage"
      - "transcode"
      - "-quality"
      - "0"
      - "-qp"
      - "{quality}"
      - "-b_depth"
      - "3"
      - "-tier"
      - "high"
      - "{profile_args}"
    presets:
      - any         # hevc_vulkan has no codec presets

  av1-10bit:                          # AV1 codec via libsvtav1
    default_quality: 18
    default_preset: "3"               # preset 3 is a good balance of speed and quality for SVT-AV1; 2+ recommended for grain retention profiles
    quality_range: [4, 30]            # CRF 0..63 for this codec; 4–30 looks to be a good working band. Unlike H26* AV1 is strongly tuned for smooth video. Grain preservation often needs very low CRF values.
    quality_granularity: 1            # libsvtav1 accepts CRF with granularity of 0.25, but float steps often produce binary-identical outputs, which cause problems with the quality search,
    encoder_args:                     # so for CRF we use granularity of 1 here instead to ensure we actually do take meaningful steps. This causes a bit of bits overhead, but it is small enough to ignore
      - "-i"
      - "{input}"
      - "-c:v"
      - "libsvtav1"
      - "-preset"
      - "{preset}"
      - "-crf"
      - "{quality}"
      - "-vf"
      - "{vf}"
      - "-pix_fmt"
      - "yuv420p10le"
      - "{profile_args}"
    presets:
      - "0"      # slowest / highest quality
      - "1"
      - "2"      # Levels of 2 or higher are recommended for grain retention profiles.
      - "3"
      - "4"
      - "5"      # Levels 4-6 are often claimed as optimal level quality vs speed
      - "6"
      - "7"
      - "8"
      - "9"
      - "10"     # near-realtime encoding
      - "11"
      - "12"
      - "13"     # fastest / lowest quality. Docs note humans shouldn't use 13 and recommend to use level 12 instead.

# ENCODING PROFILES
# Named profiles that further tune specific encoder configurations.
# Each profile: codec (reference to codecs above), description, extra_args (ffmpeg args).
profiles:
  # H.264 8-bit Profiles
  # --------------------
  h264:
    codec: h264-8bit
    description: "Default h.264 8-bit encoding with no extra tuning"
    extra_args: []

  # H.265 10-bit Profiles
  # ---------------------
  h265:
    codec: h265-10bit
    description: "Default h.265 10-bit encoding with no extra tuning"
    extra_args: []

  h265-aq:
    codec: h265-10bit
    description: "h.265 10-bit with adaptive quantization tuning for better quality distribution towards grains and darker areas"
    extra_args: ["-x265-params", "aq-mode=3:aq-strength=1.2"]

  h265-anime:
    codec: h265-10bit
    description: "h.265 10-bit optimized for anime content with reduced blocking and enhanced detail. Purpose is to retain fine details and crisp edges."
    extra_args: ["-x265-params", "no-sao=1:no-strong-intra-smoothing=1:aq-mode=3:psy-rd=2.0:psy-rdoq=1.0"]

  # HEVC NVENC (GPU) Profiles
  # --------------------------
  nvenc-h265-10bit-cq:
    codec: nvenc-h265-10bit-cq
    description: "HEVC NVENC GPU encoding — 10-bit, VBR+CQ quality mode with constrained qmin and qmax. Requires NVIDIA GPU with NVENC support."
    extra_args: []

  # nvenc-h265-10bit-qp:  # NOT RECOMMENDED
  #   codec: nvenc-h265-10bit-qp
  #   description: "HEVC NVENC GPU encoding — 10-bit, constant QP mode. Requires NVIDIA GPU with NVENC support."
  #   extra_args: []

  nvenc-h265-10bit-vbr: # NOT RECOMMENDED, CQ mode usually produces better results.
    codec: nvenc-h265-10bit-vbr
    description: "HEVC NVENC GPU encoding — 10-bit, multipass-vbr mode. Requires NVIDIA GPU with NVENC support."
    extra_args: []

  # VULKAN profiles
  # ---------------
  vulkan-h265-10bit-qp: # STRONGLY NOT RECOMMENDED, but kept enabled for people with no other GPU APIs support for testing.
    codec: vulkan-h265-10bit-qp
    description: "HEVC Vulkan encoding — 10-bit, QP mode. Requires Vulkan support."
    extra_args: []

  # AV1 10-bit Profiles
  # -------------------
  av1:
    codec: av1-10bit
    description: "AV1 10-bit encoding with no extra tuning"
    extra_args: []

  av1-grain:
    # AV1 is highly tuned for clean sources. It is not very effective for grain preservation. This profile tries to preserve original grain by disabling all the main sources of blurring and detail loss in AV1 encoding, while keeping the grain itself intact (i.e. not denoised or re-synthesized).
    codec: av1-10bit
    description: "AV1 10-bit tuned to preserve original grain and crispness."
    extra_args: ["-svtav1-params", "enable-tf=0:film-grain=0:film-grain-denoise=0:enable-restoration=0:enable-cdef=0:sharpness=1"]
    # enable-tf=0  → turns off the in-loop temporal filter (main source of 'blurring')
    # film-grain=0 → explicitly disables any film grain synthesis
    # film-grain-denoise=0 → disables grain denoising, which can cause loss of fine grain details
    # enable-restoration=0 → disables loop restoration filters, which can also blur fine details (QUESTIONABLE; could be useful in enabled state, needs testing).
    # enable-cdef=0 → disables the Constrained Directional Enhancement Filter, which can further soften the image (low-pass filter around edges to make them look cleaner and save bits; can cause blur).
    # sharpness=1 → slight bias to high-frequency details, which can help preserve grain texture (ranges from -7 to +7, default is 0)
    #
    # No `-tune` is used here, as the default of 0 (VQ) is good normally. Baseline SVT-AV1 supports only VQ, PSNR, SSIM.
    # You need a PSY or HDR forks for tunes 4/5 (for better grain retention; but the purpose of pyqenc is to work for ordinary users, who do not rebuilt/patch tools; and give others the capability to change the preset).

  # FGS AV1 profiles are intentionally named with FGS prefix first, so that they are not mixed up with the `av1*` pattern and could be targeted with "fgs*" pattern.
  # CARE: FGS doesn't preserve original grain, it tries to simulate it (often badly). This gives significant bitrate savings. Don't target VIF for FGS profiles - it's useless.
  # Multiple FGS variants with different grain strength.
  fgs-av1-light:
    codec: av1-10bit
    description: "AV1 10-bit with Film Grain Synthesis – removes original noise and replaces it with light synthetic grain (bitrate efficient, grain perception preserved)"
    extra_args: ["-svtav1-params", "film-grain=10:film-grain-denoise=1"]
    # film-grain=10 → enables film grain synthesis with a rather light grain (max 50)

  fgs-av1-medium:
    codec: av1-10bit
    description: "AV1 10-bit with Film Grain Synthesis – removes original noise and replaces it with medium synthetic grain (bitrate efficient, grain perception preserved)"
    extra_args: ["-svtav1-params", "film-grain=20:film-grain-denoise=1"]
    # film-grain=20 → enables film grain synthesis with a medium grain (max 50)

  fgs-av1-high:
    codec: av1-10bit
    description: "AV1 10-bit with Film Grain Synthesis – removes original noise and replaces it with high synthetic grain (bitrate efficient, grain perception preserved)"
    extra_args: ["-svtav1-params", "film-grain=30:film-grain-denoise=1"]
    # film-grain=30 → enables film grain synthesis with a high grain (max 50)
